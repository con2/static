# Real hostnames live in values-production.yaml.

# One Garage bucket per hostname, named exactly after it, served through Garage's built-in
# web endpoint, which picks the bucket by the Host header. The bucket must have website
# access enabled: bin/garage-buckets.sh does that.
sites:
  - 2007.tracon.fi

# The sites burned from tracontent-premium link to /media/... files that lived in one
# shared Minio bucket. Instead of copying 1.3 GiB into every site bucket, requests under
# pathPrefix on these sites get their Host header rewritten to `bucket`, so Garage serves
# that one bucket for all of them. Create it with `bin/garage-buckets.sh <bucket>`.
sharedMedia:
  bucket: tracontent-media
  pathPrefix: /media
  sites: []

garage:
  namespace: garage
  serviceName: garage
  webPort: 3902

# When false, only a plain-HTTP listener is created, so a dev cluster without cert-manager
# still gets a working Gateway.
letsencrypt:
  enabled: false
  clusterIssuer: letsencrypt-prod

tlsSecretName: static-tls
