# One Gateway for every static site. cert-manager (via the annotation) issues a single
# certificate covering every HTTPS listener's hostname into tls_secret_name, so adding a
# site to static_sites is enough to get it a certificate.
#
# Gateway API caps a Gateway at 64 listeners: one plain-HTTP listener plus one HTTPS
# listener per site leaves room for 63 sites. Split into a second Gateway past that.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: static
  annotations: !Var gateway_annotations
spec:
  gatewayClassName: traefik
  listeners: !Concat
    # No hostname on the HTTP listener: Traefik only routes what the attached HTTPRoutes
    # name, so this does not capture other apps' traffic.
    - - name: http
        protocol: HTTP
        port: 80
        allowedRoutes:
          namespaces:
            from: Same
    - !If
        test: !Var letsencrypt_enabled
        then: !Loop
          over: !Var static_sites
          as: hostname
          template:
            name: !Format "https-{hostname}"
            protocol: HTTPS
            port: 443
            hostname: !Var hostname
            tls:
              mode: Terminate
              certificateRefs:
                - kind: Secret
                  name: !Var tls_secret_name
            allowedRoutes:
              namespaces:
                from: Same
        else: []
