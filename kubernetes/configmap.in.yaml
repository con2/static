apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
data: !Index
  over: !Var static_sites
  as: hostname
  by: !Format "{hostname}.conf"
  template: !Format |
    server {{
      listen 80;
      server_name {hostname};

      # Try the exact key first; on a Minio 404 (eg. a hub page like /blog
      # that only has blog/index.html, no bare "blog" key, because burn.py
      # can't write both without colliding with its own children on Minio's
      # storage backend), fall back to appending /index.html. This also
      # covers plain trailing-slash requests, replacing the old special case
      # for those.
      location / {{
        proxy_intercept_errors on;
        error_page 404 = @fallback;
        rewrite /(.*) /{minio_bucket_name}/{hostname}/$1 break;
        proxy_pass {minio_internal_url};
        proxy_redirect off;
      }}

      location @fallback {{
        # $uri here is already /{minio_bucket_name}/{hostname}/... from the
        # location /'s rewrite above (error_page preserves it, doesn't reset
        # to the original client path) -- just strip a trailing slash and
        # append /index.html, don't re-add the bucket/hostname prefix.
        rewrite ^(.*)/$ $1;
        rewrite ^(.*)$ $1/index.html break;
        proxy_pass {minio_internal_url};
        proxy_redirect off;
      }}
    }}
