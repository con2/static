static_sites:
  - 2007.tracon.fi

# Each site is served from the Garage bucket named exactly after its hostname, through
# Garage's built-in web endpoint (port 3902 on the garage Service). The bucket must have
# website access enabled: bin/garage-buckets.sh does that.
garage_namespace: garage
garage_service_name: garage
garage_web_port: 3902

# Set in production.vars.yaml. When false, only a plain-HTTP listener is created, so a dev
# cluster without cert-manager still gets a working Gateway.
letsencrypt_enabled: false

# HTTP->HTTPS redirect is a per-app HTTPRoute instead of a global Traefik entrypoint
# redirect - see infrastructure/kubernetes/traefik-middlewares.yaml for why (ACME HTTP-01
# safety).
gateway_annotations: !If
  test: !Var letsencrypt_enabled
  then:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  else: {}

tls_secret_name: static-tls
